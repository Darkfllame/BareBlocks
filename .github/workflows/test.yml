name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # Minecraft's data generators (26.x needs java 25)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Mojang's jar and assets, so they're not downloaded on every run
      - name: Cache Minecraft data
        uses: actions/cache@v4
        with:
          path: .mccache
          key: mccache-${{ hashFiles('build.zig') }}
          restore-keys: mccache-

      - run: zig build test --summary all
